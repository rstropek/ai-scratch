<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -40 680 420">
  <!-- Drawn for the Digitalferien deck in Scratch costume style: a cable car up the mountain in mountain.svg (same viewBox),
       its cabin labelled KI. -->
  <title>Eine Seilbahn mit KI-Kabine</title>
  <!-- cable -->
  <path d="M 384 68 L 630 300" stroke="#2a3352" stroke-width="5" stroke-linecap="round"/>
  <!-- top station -->
  <path d="M 380 90 V 112" stroke="#4d5b80" stroke-width="6" stroke-linecap="round"/>
  <rect x="352" y="62" width="40" height="30" rx="5" fill="#e9f1fc" stroke="#4d5b80" stroke-width="4"/>
  <path d="M 346 66 L 372 46 L 398 66 Z" fill="#e6335f" stroke="#9e1f40" stroke-width="4" stroke-linejoin="round"/>
  <!-- valley station -->
  <rect x="600" y="318" width="64" height="50" rx="6" fill="#e9f1fc" stroke="#4d5b80" stroke-width="4"/>
  <rect x="620" y="338" width="24" height="30" rx="4" fill="#4d5b80"/>
  <path d="M 592 322 L 632 294 L 672 322 Z" fill="#e6335f" stroke="#9e1f40" stroke-width="4" stroke-linejoin="round"/>
  <!-- cabin, hanging from the cable -->
  <path d="M 493 171 V 198" stroke="#4d5b80" stroke-width="6" stroke-linecap="round"/>
  <circle cx="493" cy="171" r="8" fill="#4d5b80" stroke="#2a3352" stroke-width="3"/>
  <rect x="454" y="196" width="78" height="64" rx="13" fill="#e6335f" stroke="#9e1f40" stroke-width="5"/>
  <path d="M 466 204 H 500" stroke="#ff8fab" stroke-width="5" stroke-linecap="round"/>
  <rect x="463" y="212" width="60" height="38" rx="8" fill="#e9f1fc" stroke="#9e1f40" stroke-width="4"/>
  <!-- K and I as strokes, so the label doesn't depend on a font -->
  <path d="M 479 220 V 242 M 494 220 L 481 231 L 494 242 M 507 220 V 242" fill="none" stroke="#1b1340" stroke-width="6"
    stroke-linecap="round" stroke-linejoin="round"/>
</svg>
