<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220">
  <!-- Drawn for the Digitalferien deck in Scratch costume style (the Scratch library has no panda): a sitting panda. -->
  <title>Panda</title>
  <g stroke="#1b1340" stroke-width="5" stroke-linejoin="round">
    <!-- legs and body -->
    <ellipse cx="100" cy="160" rx="66" ry="54" fill="#fff"/>
    <ellipse cx="58" cy="196" rx="30" ry="20" fill="#2a2d3d"/>
    <ellipse cx="142" cy="196" rx="30" ry="20" fill="#2a2d3d"/>
    <ellipse cx="58" cy="198" rx="13" ry="9" fill="#5a5f78" stroke="none"/>
    <ellipse cx="142" cy="198" rx="13" ry="9" fill="#5a5f78" stroke="none"/>
    <path d="M 44 128 C 30 140, 30 164, 48 170 C 60 172, 66 158, 64 140 Z" fill="#2a2d3d"/>
    <path d="M 156 128 C 170 140, 170 164, 152 170 C 140 172, 134 158, 136 140 Z" fill="#2a2d3d"/>
    <!-- ears and head -->
    <circle cx="50" cy="40" r="22" fill="#2a2d3d"/>
    <circle cx="150" cy="40" r="22" fill="#2a2d3d"/>
    <ellipse cx="100" cy="78" rx="66" ry="58" fill="#fff"/>
  </g>
  <!-- eye patches, eyes, nose, mouth -->
  <ellipse cx="72" cy="76" rx="17" ry="22" transform="rotate(30 72 76)" fill="#2a2d3d"/>
  <ellipse cx="128" cy="76" rx="17" ry="22" transform="rotate(-30 128 76)" fill="#2a2d3d"/>
  <circle cx="75" cy="74" r="8" fill="#fff"/>
  <circle cx="125" cy="74" r="8" fill="#fff"/>
  <circle cx="77" cy="75" r="4.5" fill="#1b1340"/>
  <circle cx="123" cy="75" r="4.5" fill="#1b1340"/>
  <path d="M 90 98 Q 100 92, 110 98 Q 100 110, 90 98 Z" fill="#1b1340" stroke="#1b1340" stroke-width="3" stroke-linejoin="round"/>
  <path d="M 88 112 Q 100 122, 112 112" fill="none" stroke="#1b1340" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="60" cy="102" rx="9" ry="6" fill="#ffb3c4"/>
  <ellipse cx="140" cy="102" rx="9" ry="6" fill="#ffb3c4"/>
</svg>
