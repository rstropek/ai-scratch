<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -40 680 420">
  <!-- Drawn for the Digitalferien deck in Scratch costume style: a mountain with a hiking trail up its left side and a flag on top, the goal.
       cable-car.svg shares this viewBox, so it lies exactly over it. -->
  <title>Ein Berg mit Wanderweg</title>
  <!-- flag on the summit -->
  <path d="M 320 44 V -30" stroke="#4d5b80" stroke-width="6" stroke-linecap="round"/>
  <path d="M 323 -30 L 374 -15 L 323 0 Z" fill="#ffd84d" stroke="#cc9900" stroke-width="4" stroke-linejoin="round"/>
  <!-- rock, shadow side, meadow -->
  <path d="M 10 370 L 140 190 L 190 230 L 320 40 L 450 200 L 500 160 L 590 370 Z" fill="#a9b4d0"/>
  <path d="M 320 40 L 450 200 L 500 160 L 590 370 H 410 L 366 246 Z" fill="#8691b0"/>
  <path d="M 10 370 L 60 301 C 140 280, 220 312, 300 290 C 380 268, 460 300, 550 277 L 590 370 Z"
    fill="#5cb85a" stroke="#3f8f3a" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 80 312 C 130 298, 170 306, 210 304" fill="none" stroke="#8fd97f" stroke-width="9" stroke-linecap="round"/>
  <!-- the trail: switchbacks from the meadow to the summit -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="trail" d="M 96 360 C 190 352, 262 342, 250 324 C 238 306, 160 300, 172 280 C 184 260, 270 262, 272 242 C 274 224, 222 220, 232 202 C 242 184, 296 180, 296 160 C 296 142, 268 140, 278 122 C 288 104, 310 80, 318 54"
      stroke="#b8894a" stroke-width="17"/>
    <path d="M 96 360 C 190 352, 262 342, 250 324 C 238 306, 160 300, 172 280 C 184 260, 270 262, 272 242 C 274 224, 222 220, 232 202 C 242 184, 296 180, 296 160 C 296 142, 268 140, 278 122 C 288 104, 310 80, 318 54"
      stroke="#f4dba6" stroke-width="9"/>
  </g>
  <!-- snow cap, over the trail's last bit -->
  <path d="M 320 40 L 397 135 L 376 124 L 358 144 L 338 122 L 318 142 L 298 120 L 278 138 L 255 135 Z"
    fill="#fff" stroke="#8f9bbd" stroke-width="4" stroke-linejoin="round"/>
  <!-- two pines on the meadow -->
  <g stroke="#2f6e2a" stroke-width="4" stroke-linejoin="round">
    <rect x="440" y="290" width="10" height="16" rx="3" fill="#8a5a2b"/>
    <path d="M 445 236 L 470 294 H 420 Z" fill="#3f8f3a"/>
    <rect x="490" y="282" width="10" height="14" rx="3" fill="#8a5a2b"/>
    <path d="M 495 236 L 516 286 H 474 Z" fill="#3f8f3a"/>
  </g>
  <!-- outline on top -->
  <path d="M 10 370 L 140 190 L 190 230 L 320 40 L 450 200 L 500 160 L 590 370 Z"
    fill="none" stroke="#4d5b80" stroke-width="6" stroke-linejoin="round"/>
</svg>
