<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 190">
  <!-- Drawn for the Digitalferien deck in Scratch costume style: flat fills, darker outline of the same hue. -->
  <title>Gehirn</title>
  <defs>
    <g id="lobes">
      <circle cx="62" cy="78" r="40"/>
      <circle cx="104" cy="56" r="44"/>
      <circle cx="150" cy="70" r="40"/>
      <circle cx="172" cy="108" r="32"/>
      <circle cx="138" cy="122" r="36"/>
      <circle cx="90" cy="124" r="38"/>
      <circle cx="50" cy="112" r="32"/>
      <circle cx="110" cy="96" r="48"/>
    </g>
  </defs>
  <!-- brain stem, behind -->
  <path d="M122 140 C 124 158, 120 170, 112 180 L 138 180 C 140 166, 142 154, 146 142 Z" fill="#f27fa9" stroke="#c23d6f" stroke-width="5" stroke-linejoin="round"/>
  <!-- outline: the same lobes, stroked thick underneath -->
  <use href="#lobes" fill="#c23d6f" stroke="#c23d6f" stroke-width="10"/>
  <use href="#lobes" fill="#ff9ec4"/>
  <!-- light from the top left -->
  <path d="M70 46 C 84 30, 110 24, 128 30" fill="none" stroke="#ffd3e4" stroke-width="9" stroke-linecap="round"/>
  <!-- folds -->
  <g fill="none" stroke="#e0578a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M110 22 C 104 40, 116 52, 108 70 C 102 84, 112 96, 108 112"/>
    <path d="M60 64 C 72 60, 80 68, 76 80"/>
    <path d="M150 50 C 160 58, 156 70, 168 76"/>
    <path d="M40 104 C 52 98, 62 104, 66 96"/>
    <path d="M150 116 C 160 112, 170 118, 180 112"/>
    <path d="M78 138 C 88 130, 100 136, 106 128"/>
  </g>
  <!-- face -->
  <g transform="translate(0 4)">
    <ellipse cx="88" cy="92" rx="13" ry="16" fill="#fff" stroke="#c23d6f" stroke-width="3"/>
    <ellipse cx="132" cy="92" rx="13" ry="16" fill="#fff" stroke="#c23d6f" stroke-width="3"/>
    <circle cx="91" cy="95" r="7" fill="#1b1340"/>
    <circle cx="135" cy="95" r="7" fill="#1b1340"/>
    <circle cx="93.5" cy="92" r="2.4" fill="#fff"/>
    <circle cx="137.5" cy="92" r="2.4" fill="#fff"/>
    <path d="M98 118 C 106 126, 116 126, 124 118" fill="none" stroke="#1b1340" stroke-width="4.5" stroke-linecap="round"/>
    <ellipse cx="70" cy="114" rx="8" ry="5" fill="#ff7aa8" opacity="0.8"/>
    <ellipse cx="150" cy="114" rx="8" ry="5" fill="#ff7aa8" opacity="0.8"/>
  </g>
</svg>
