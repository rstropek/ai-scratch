# Every push to main: check + unit tests, build the image, push it to ACR and run it in the staging slot.
# Production only changes through the "Swap to production" workflow (swap.yml).
name: Deploy to staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-ai-scratch
  cancel-in-progress: false

env:
  REGISTRY: acrars2025.azurecr.io
  IMAGE: acrars2025.azurecr.io/ai-scratch:${{ github.sha }}
  RG: 2026-digitalferien
  APP: ai-scratch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login -n acrars2025
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the image in the staging slot
        run: >
          az webapp config set -g "$RG" -n "$APP" --slot staging -o none
          --linux-fx-version "DOCKER|$IMAGE"
          --generic-configurations '{"acrUseManagedIdentityCreds": true}'
      - name: Wait until staging runs this commit
        run: |
          for i in $(seq 60); do
            version=$(curl -sf --max-time 10 https://ai-scratch-staging.azurewebsites.net/healthz | jq -r .version || true)
            echo "attempt $i: ${version:-no answer}"
            [[ "$version" == "$GITHUB_SHA" ]] && exit 0
            sleep 10
          done
          echo "::error::staging did not start ${GITHUB_SHA} within 10 minutes"
          exit 1
