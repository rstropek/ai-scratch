# Every push and pull request: all tests that need no real API keys (check, unit/component tests, the office build,
# both apps' e2e tests, the game checks against the reference games). Then, on main, for each app whose files (or a
# shared root file) changed: build its image, push it to ACR and run it in production (no staging slots). A deploy
# restarts the app: the kids' app cuts the chat turns in progress, so don't push it while kids are using it.
name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: acrars2025.azurecr.io
  RG: 2026-digitalferien

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build -w apps/office

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/app
      - run: npm run e2e -w apps/app

  office-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aiscratch_e2e
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/office
      - run: npm run e2e -w apps/office

  # the harness's automatic game checks against hand-built and CoderDojo games: no model calls
  games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        working-directory: apps/app
      - run: npm run build -w apps/app
      - run: node eval/games/reference.ts
        working-directory: apps/app
      - run: npm run eval:games -w apps/app -- --references
        env:
          # the app's server needs keys to start; the reference checks never call a model
          ANTHROPIC_API_KEY: ci-no-real-calls
          JEV_API_KEY: ci-no-real-calls

  # does this push change what an app's image is built from?
  changes:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.diff.outputs.app }}
      office: ${{ steps.diff.outputs.office }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != push ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"; echo "office=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "$files"
          shared='package\.json$|package-lock\.json$|\.npmrc$|tsconfig\.base\.json$|\.github/workflows/deploy\.yml$'
          changed() { grep -qE "^($1|$shared)" <<< "$files" && echo true || echo false; }
          echo "app=$(changed 'apps/app/')" >> "$GITHUB_OUTPUT"
          echo "office=$(changed 'apps/office/|packages/db/')" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [test, e2e, games, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: azure-ai-scratch
      cancel-in-progress: false
    env:
      IMAGE: acrars2025.azurecr.io/ai-scratch:${{ github.sha }}
      APP: ai-scratch
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login -n acrars2025
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/app/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the image in production
        run: >
          az webapp config set -g "$RG" -n "$APP" -o none
          --linux-fx-version "DOCKER|$IMAGE"
          --generic-configurations '{"acrUseManagedIdentityCreds": true}'
      - name: Wait until production runs this commit
        run: |
          for i in $(seq 60); do
            version=$(curl -sf --max-time 10 https://ai-scratch.dev/healthz | jq -r .version || true)
            echo "attempt $i: ${version:-no answer}"
            [[ "$version" == "$GITHUB_SHA" ]] && exit 0
            sleep 10
          done
          echo "::error::the kids' app did not start ${GITHUB_SHA} within 10 minutes"
          exit 1

  deploy-office:
    needs: [test, office-e2e, changes]
    if: github.ref == 'refs/heads/main' && needs.changes.outputs.office == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: azure-ai-scratch-office
      cancel-in-progress: false
    env:
      IMAGE: acrars2025.azurecr.io/ai-scratch-office:${{ github.sha }}
      APP: ai-scratch-office
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login -n acrars2025
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/office/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=office
          cache-to: type=gha,mode=max,scope=office
      - name: Run the image in production
        run: >
          az webapp config set -g "$RG" -n "$APP" -o none
          --linux-fx-version "DOCKER|$IMAGE"
          --generic-configurations '{"acrUseManagedIdentityCreds": true}'
      - name: Wait until production runs this commit
        run: |
          for i in $(seq 60); do
            version=$(curl -sf --max-time 10 https://office.ai-scratch.dev/healthz | jq -r .version || true)
            echo "attempt $i: ${version:-no answer}"
            [[ "$version" == "$GITHUB_SHA" ]] && exit 0
            sleep 10
          done
          echo "::error::the office did not start ${GITHUB_SHA} within 10 minutes"
          exit 1
