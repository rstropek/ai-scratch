# Manual: swaps staging and production. Production then runs what staging ran, and staging keeps the old
# production image, so running this again rolls back. Don't run it while kids are using the app: the swap
# restarts production and cuts running chats.
name: Swap to production

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-ai-scratch
  cancel-in-progress: false

env:
  RG: 2026-digitalferien
  APP: ai-scratch

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - name: Version in staging
        id: staging
        run: |
          version=$(curl -sf --max-time 10 https://ai-scratch-staging.azurewebsites.net/healthz | jq -r .version)
          [[ -n "$version" && "$version" != null ]] || { echo "::error::staging does not answer /healthz"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az webapp deployment slot swap -g "$RG" -n "$APP" --slot staging --target-slot production -o none
      - name: Check that production runs the staging version
        env:
          EXPECTED: ${{ steps.staging.outputs.version }}
        run: |
          for i in $(seq 30); do
            version=$(curl -sf --max-time 10 https://ai-scratch.azurewebsites.net/healthz | jq -r .version || true)
            echo "attempt $i: ${version:-no answer}"
            [[ "$version" == "$EXPECTED" ]] && exit 0
            sleep 10
          done
          echo "::error::production does not run ${EXPECTED}"
          exit 1
